# Smoke test (minutes): the best PyTorch configuration on 2 scenes, 1 seed. Checks the whole path before long runs.
experiment: smoke
load_dtype: bfloat16
attn_implementation: sdpa
optimizations: {prefill_last_logit_only: true, expert_cuda_graph: {max_batch_size: 1, max_graphs: 4}}
plan: {warmup_min: 2, warmup_max: 2, n_varied: 3, n_repeated: 1, n_staged: 2, max_minutes: 5}
n_scenes: 2
behavior: {seeds: [0], n_scenes: 2}
configs:
  - {name: official, max_generation_length: 256, common_flow_noise: true}
